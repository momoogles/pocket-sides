[tools]
node = "24.22.1"
pnpm = "12.16.1"

[tasks.install]
description = "Install the project dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Install dependencies and start the local web app"
depends = ["install"]
run = "pnpm dev"

[tasks.build]
description = "Install dependencies and build the GitHub Pages app"
depends = ["install"]
run = "pnpm build"

[tasks.preview]
description = "Build and preview the GitHub Pages app locally"
depends = ["build"]
run = "pnpm preview"
